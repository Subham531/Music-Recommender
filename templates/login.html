<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Recommender Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        /* small, local flash styles to avoid inline Jinja in style attributes */
        .flash { font-size: 0.9rem; margin-bottom: 15px; font-weight: bold; }
        .flash.warning { color: #e67e22; }
        .flash.success { color: #27ae60; }
        .flash.info { color: #2980b9; }
    </style>
</head>
<body>
    <form method="POST" action="{{ url_for('login') }}" role="form">
        <h2>Login Here</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p class="flash {{ category }}">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <input id="email" type="email" name="email" placeholder="Email" required>
        <input id="pswd" type="password" name="password" placeholder="Password" required>
        
        <button id="btn" type="submit">Login</button>

        <p style="margin-top: 15px; font-size: 0.9rem;">
            New here? <a href="{{ url_for('signup') }}" style="color: #007bff; text-decoration: none;">Create an account</a>
        </p>
    </form>
</body>
</html>
